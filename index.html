<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#222b36;--mut:#6b7684;--navy:#2f3a49;--red:#c4262e;--green:#0a7a45;--gold:#a87b00;--blue:#2f6fb0;--line:#e1e6e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171d26;--card:#222b38;--ink:#eef2f1;--mut:#9aa6b4;--line:#33404f}}
:root[data-theme="dark"]{--bg:#171d26;--card:#222b38;--ink:#eef2f1;--mut:#9aa6b4;--line:#33404f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}input,select,textarea,.md label input,.md label select,.md label textarea{font-size:16px!important}
.md form{overflow-x:hidden!important;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.md form *{max-width:100%;min-width:0}.md form input[type=date],.md form input[type=number],.md form input[type=tel],.md form input[type=text]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-height:44px;text-align:right}.md form input[type=date]::-webkit-date-and-time-value{text-align:right;min-width:0}.md form input[type=date]::-webkit-calendar-picker-indicator{margin:0}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 Cairo,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
aside{width:236px;background:var(--navy);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
aside h1{font-size:17px;font-weight:800;margin:0 8px 2px}aside small{display:block;margin:0 8px 18px;opacity:.65}
aside a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:#dfe5ea;text-decoration:none;font-weight:600;margin-bottom:2px}
aside a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
aside a.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset -3px 0 var(--red)}
aside a:hover{background:rgba(255,255,255,.07)}
main{flex:1;min-width:0;padding:0 22px 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:18px}
.chips{display:flex;gap:8px;overflow-x:auto;flex:1;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;white-space:nowrap;cursor:pointer;font-weight:600;display:flex;gap:7px;align-items:center}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--mut))}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;cursor:pointer;flex:none}
#mb{display:none}
.ph{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ph h2{margin:0;font-size:22px;font-weight:800}.cnt{background:var(--navy);color:#fff;border-radius:99px;padding:0 10px;font-size:13px}
.ph .sp{flex:1}
.sr,.fld,select,input,textarea{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;outline:none}
.sr{width:200px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.g{background:var(--green)}.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
